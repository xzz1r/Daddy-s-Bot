# La puerta, en cada push. Es la misma que corre actualizar.sh antes de
# desplegar, pero aqui avisa al subir y no el dia que alguien despliega.
#
# Corre en un clon limpio —sin data/, sin .env, sin la despensa llena— y
# eso es parte de lo que prueba: una capa que solo pasa con el estado de la
# VPS no esta comprobando el codigo.
#
# Sin secretos y con permisos de solo lectura: el repositorio es publico y
# esto no necesita nada mas que el codigo.
name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # Igual que en la VPS: sin dependencias de desarrollo y sin scripts de
      # instalacion (sharp y compania no hacen falta para comprobar nada).
      - run: npm ci --omit=dev --ignore-scripts --no-fund --no-audit
      # yt-dlp, como en la VPS (lo instala setup.sh). Sin el, y sin API
      # configurada, *!tt*, *!ig* y *!x* ni se intentan, y las capas que los
      # prueban no tendrian nada que probar. Es una herramienta del sistema,
      # igual que Node: no es estado de la maquina.
      - run: pipx install yt-dlp
      - run: node scripts/check.js
